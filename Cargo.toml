[package]
name = "brief-bright-gone"
version = "0.1.0"
edition = "2024"
description = "Brief, Bright, Gone — communication-efficiency for coding agents: detect -> safety-classify -> normalize"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
