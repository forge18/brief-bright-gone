name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fast-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

  integration:
    name: linux-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run deterministic boundary tests
        run: >-
          cargo test --test proxy_integration --test filesystem_integration
          --test cli_integration --test installer_integration

  generated:
    name: linux-generated-regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Replay generated sigil and redaction corpus
        run: cargo test --test redaction_sigil_regression

  fuzz-replay:
    name: scheduled-bounded-fuzz-replay
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run bounded deterministic fuzz replay
        run: cargo test --release --test redaction_sigil_regression

  performance:
    name: scheduled-fixed-fixture-performance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Measure fixed local fixtures
        run: python3 benchmarks/fixed_fixture.py --out benchmarks/results/fixed-fixture.json
      - name: Upload trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-fixture-performance
          path: benchmarks/results/fixed-fixture.json
