name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: bbg-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            name: bbg-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: bbg-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: bbg-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: bbg-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compile toolchain (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "${BIN_DIR}/bbg.exe" bbg.exe
            cp "${BIN_DIR}/bbg-proxy.exe" bbg-proxy.exe
            tar -czf "${{ matrix.name }}.tar.gz" bbg.exe bbg-proxy.exe
          else
            cp "${BIN_DIR}/bbg" bbg
            cp "${BIN_DIR}/bbg-proxy" bbg-proxy
            tar -czf "${{ matrix.name }}.tar.gz" bbg bbg-proxy
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate release archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in artifacts/*.tar.gz; do
            entries="$(tar -tzf "$archive")"
            case "$archive" in
              *windows*) expected=$'bbg.exe\nbbg-proxy.exe' ;;
              *) expected=$'bbg\nbbg-proxy' ;;
            esac
            if [ "$entries" != "$expected" ]; then
              echo "invalid archive contents: $archive" >&2
              exit 1
            fi
          done

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
